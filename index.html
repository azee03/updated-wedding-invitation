<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#640d1c" />
  <meta name="description" content="A wedding invitation for Adv. Thasnim N.S and Muhamed Uvais S — 10 December 2026." />
  <title>Thasnim &amp; Muhamed Uvais | Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body class="cover-page">
  <main class="cover-scene">
    <div class="ambient-glow" aria-hidden="true"></div>
    <section class="cover-card" aria-labelledby="cover-title">
      <span class="corner-flourish corner-flourish--tl" aria-hidden="true">❧</span>
      <span class="corner-flourish corner-flourish--tr" aria-hidden="true">❧</span>
      <span class="corner-flourish corner-flourish--bl" aria-hidden="true">❧</span>
      <span class="corner-flourish corner-flourish--br" aria-hidden="true">❧</span>

      <div class="cover-topline"><span></span><b lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</b><span></span></div>
      <p id="cover-title" class="cover-kicker">With the blessings of Allah</p>
      <p class="cover-intro">Two hearts, one beautiful beginning</p>

      <a class="seal-link" href="invitation.html" aria-label="Open the wedding invitation">
        <span class="seal-ring seal-ring--outer" aria-hidden="true"></span>
        <span class="seal-ring seal-ring--inner" aria-hidden="true"></span>
        <span class="seal-stars" aria-hidden="true">✦</span>
        <span class="seal-monogram">M <i>&amp;</i> T</span>
        <span class="seal-stars seal-stars--bottom" aria-hidden="true">✦</span>
      </a>

      <p class="cover-tap"><span class="tap-dot" aria-hidden="true"></span> Tap the seal to open <span class="tap-dot" aria-hidden="true"></span></p>
      <div class="cover-divider" aria-hidden="true"><span>✧</span></div>
      <p class="cover-date">Thursday <span>·</span> 10 December 2026</p>
    </section>
    <p class="cover-footer">Made with love &amp; duas</p>
  </main>
</body>
</html>
